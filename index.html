<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Desk</div>
      <div class="tools">
        <button id="pin" type="button" aria-pressed="false">置顶</button>
        <button id="pet" type="button">桌宠</button>
        <button id="add" type="button">加词</button>
        <button id="close" type="button" title="收到托盘">×</button>
      </div>
    </header>
    <main id="stage"></main>
    <footer id="meta"></footer>
  </div>
  <div class="plant" aria-hidden="true">
    <svg viewBox="0 0 80 100" width="76" height="95">
      <ellipse class="shadow" cx="40" cy="95" rx="16" ry="3"/>
      <path class="pot" d="M27 74h26l-4.2 16H31.2z"/>
      <rect class="rim" x="23" y="69.5" width="34" height="6" rx="1.6"/>
      <path class="stem" d="M40 74c1.2-8 .2-16-.4-26"/>
      <g class="sway a">
        <path class="leaf" d="M39 60c-15-1-22 7-17 12 7-.4 13-3.4 17-8z"/>
      </g>
      <g class="sway b">
        <path class="leaf alt" d="M41 51c13-8 23-2 19 4-7.5 1.2-15-.4-19-4z"/>
      </g>
      <g class="sway c">
        <path class="bud" d="M40 48c-5.5-11-1.2-18 .6-20 1.6 2.4 5.2 9-.6 20z"/>
      </g>
    </svg>
  </div>
  <div id="pet-layer" class="pet-layer">
    <div class="pet-plant" aria-hidden="true">
      <svg viewBox="0 0 80 100" width="92" height="114">
        <ellipse class="shadow" cx="40" cy="95" rx="16" ry="3"/>
        <path class="pot" d="M27 74h26l-4.2 16H31.2z"/>
        <rect class="rim" x="23" y="69.5" width="34" height="6" rx="1.6"/>
        <path class="stem" d="M40 74c1.2-8 .2-16-.4-26"/>
        <g class="sway a">
          <path class="leaf" d="M39 60c-15-1-22 7-17 12 7-.4 13-3.4 17-8z"/>
        </g>
        <g class="sway b">
          <path class="leaf alt" d="M41 51c13-8 23-2 19 4-7.5 1.2-15-.4-19-4z"/>
        </g>
        <g class="sway c">
          <path class="bud" d="M40 48c-5.5-11-1.2-18 .6-20 1.6 2.4 5.2 9-.6 20z"/>
        </g>
      </svg>
    </div>
    <div id="pet-word" class="pet-word"></div>
    <button id="expand" class="pet-open" type="button">展开</button>
  </div>
  <div id="adder" class="adder hidden"></div>
  <script src="renderer.js"></script>
</body>
</html>
