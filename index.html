<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Desk</div>
      <div class="tools">
        <button id="pin" type="button" aria-pressed="false">置顶 P</button>
        <button id="pet" type="button" title="M 在学习和桌宠之间切换">桌宠 M</button>
        <button id="browse" type="button">词表 B</button>
        <button id="add" type="button">加词 A</button>
        <button id="close" type="button" title="收到托盘">×</button>
      </div>
    </header>
    <main id="stage"></main>
    <footer id="meta"></footer>
  </div>
  <div class="plant" aria-hidden="true">
    <img src="pet.png" alt="">
  </div>
  <div id="pet-layer" class="pet-layer">
    <div class="pet-plant" aria-hidden="true">
      <img src="pet.png" alt="">
    </div>
    <div id="pet-word" class="pet-word"></div>
    <button id="expand" class="pet-open" type="button" title="M 回到学习窗口">展开 M</button>
  </div>
  <div id="adder" class="adder hidden"></div>
  <script src="renderer.js"></script>
</body>
</html>
